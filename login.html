<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - ConnectaPet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="./css/styles.css" rel="stylesheet">
</head>
<body class="auth-container">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card auth-card">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <a href="index.html" class="text-decoration-none">
                                <h2 class="text-primary fw-bold"><i class="bi bi-heart-pulse me-2"></i>ConnectaPet</h2>
                            </a>
                            <p class="text-muted">Ingresa a tu cuenta</p>
                        </div>
                        
                        <form id="loginform" method="post">
                            <div class="mb-3">
                                <label for="email" class="form-label">Correo Electrónico</label>
                                <input type="email" class="form-control" id="email" placeholder="usuario@ejemplo.com" required>
                            </div>
                            
                            <div class="mb-3">
                                <label for="password" class="form-label">Contraseña</label>
                                <div class="input-group">
                                    <input type="password" class="form-control" id="password" placeholder="Introduce tu contraseña" required>
                                    <button type="button" class="btn btn-outline-secondary" id="togglePassword">
                                        <i class="bi bi-eye"></i>
                                    </button>
                                </div>
                            </div>
                            
                            <div class="mb-3 form-check">
                                <input type="checkbox" class="form-check-input" id="rememberMe">
                                <label class="form-check-label" for="rememberMe">Recordar mi sesión</label>
                            </div>
                            
                            <button type="submit" class="btn btn-primary w-100 py-2 mb-3">Iniciar Sesión</button>
                            
                            <div id="login-error" class="alert alert-danger mt-3" style="display: none;">
                                Correo o contraseña incorrectos. Por favor, inténtalo de nuevo.
                            </div>
                            
                            <div class="text-center">
                                <p class="mb-0">¿No tienes una cuenta? <a href="registro.html" class="text-decoration-none">Regístrate aquí</a></p>
                                <p class="mt-2"><a href="#" class="text-decoration-none">¿Olvidaste tu contraseña?</a></p>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./javascript/login.js"></script>
</body>
</html>
