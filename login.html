<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConnectaPet - Iniciar sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="d-flex flex-column min-vh-100">
    <header class="text-center w-100">
        <nav class="text-bg-danger justify-content-between align-items-center px-4 py-3 shadow-sm bg-white w-100">
            <div class="fw-bold fs-4 text-primary">
                ConnectaPet
            </div>
    </header>
    <div class="container d-flex justify-content-center align-items-center flex-grow-1">
        <div id="login-page" class="row justify-content-center w-100">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow">
                    <div class="card-body p-4">

                        <h1 class="text-center mb-4 text-primary">Iniciar Sesión</h1>

                        <form id="loginForm">
                            <div class="mb-3">
                                <label for="loginEmail" class="form-label">Correo electrónico</label>
                                <input type="email" class="form-control" id="loginEmail" required>
                            </div>
                            <div class="mb-3">
                                <label for="loginPassword" class="form-label">Contraseña</label>
                                <input type="password" class="form-control" id="loginPassword" required>
                            </div>
                            <div id="loginMessage" class="alert alert-danger" style="display:none;"></div>
                            <button type="submit" class="btn btn-primary w-100">Ingresar</button>
                        </form>

                    </div>
                </div>
            </div>
        </div>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script> 
    <script src="javascript/login.js"></script>

</body>

</html>
