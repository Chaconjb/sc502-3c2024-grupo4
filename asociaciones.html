<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConnectaPet - Asociaciones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="d-flex flex-column min-vh-100 bg-dark">
    <header class="w-100">
        <nav class="d-flex justify-content-between align-items-center px-4 py-3 shadow-sm bg-white w-100">
            <div class="fw-bold fs-4 text-primary">ConnectaPet</div>
            <ul class="d-flex gap-4 list-unstyled mb-0">
                <li><a href="home.html" class="text-decoration-none text-dark fw-semibold">Inicio</a></li>
                <li><a href="asociaciones.html" class="text-decoration-none text-dark">Asociaciones</a></li>
                <li><a href="transparencia.html" class="text-decoration-none text-dark">Transparencia</a></li>
                <li><a href="registro.html" class="text-decoration-none text-dark">Registrarse</a></li>
                <li><a href="donacion.html" class="text-decoration-none text-dark">Donaciones</a></li>
                <li><a href="login.html" class="text-decoration-none text-dark">Inicio de sesion</a></li>
                <li><a href="campanas.html" class="text-decoration-none text-dark">campañas</a></li>
            </ul>
        </nav>
    </header>

    <main class="container flex-grow-1 py-5">
        <header class="mb-4 text-center">
            <h1 class="fw-bold text-white mb-2">Asociaciones registradas</h1>
            <p class="text-light mb-0">Explora las organizaciones que forman parte de ConnectaPet.</p>
        </header>

        <section class="mb-4">
            <div class="card shadow-sm border-0">
                <div class="card-body">
                    <form class="row g-3 align-items-end">
                        <div class="col-md-4">
                            <label for="filtroNombre" class="form-label">Buscar por nombre</label>
                            <input type="text" id="filtroNombre" class="form-control" placeholder="Ej: Patitas">
                        </div>
                        <div class="col-md-4">
                            <label for="filtroProvincia" class="form-label">Provincia</label>
                            <select id="filtroProvincia" class="form-select">
                                <option value="">Todas</option>
                                <option>San José</option>
                                <option>Alajuela</option>
                                <option>Heredia</option>
                                <option>Cartago</option>
                                <option>Guanacaste</option>
                                <option>Puntarenas</option>
                                <option>Limón</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <button type="button" id="btnAplicarFiltros" class="btn btn-primary w-100">Aplicar filtros</button>
                        </div>
                    </form>
                </div>
            </div>
        </section>

        <section id="contenedorAsociaciones" class="row g-4">
            <div class="col-12 text-center text-white">
                <p>Cargando asociaciones...</p>
            </div>
        </section>
    </main>

    <footer class="py-3 text-center text-white-50 mt-auto">
        <small>© 2024 ConnectaPet. Bienestar animal con transparencia.</small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="javascript/asociaciones.js"></script>
</body>
</html>
