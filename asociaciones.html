<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asociaciones - ConnectaPet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="./css/styles.css" rel="stylesheet">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                <i class="bi bi-heart-pulse me-2"></i>ConnectaPet
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="asociaciones.html">Asociaciones</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="transparencia.html">Transparencia</a>
                    </li>
                </ul>
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="login.html" id="login-nav">Iniciar Sesión</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Header -->
    <section class="bg-primary text-white py-5">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-lg-8">
                    <h1 class="display-4 fw-bold">Asociaciones de Bienestar Animal</h1>
                    <p class="lead">Conoce y apoya a las organizaciones que trabajan por el bienestar animal.</p>
                </div>
                <div class="col-lg-4 text-lg-end">
                    <div class="input-group">
                        <input type="text" class="form-control" placeholder="Buscar asociaciones..." id="buscar-asociaciones">
                        <button class="btn btn-light" type="button" id="boton-buscar">
                            <i class="bi bi-search"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Filtros -->
    <section class="py-4 bg-light">
        <div class="container">
            <div class="row g-3 align-items-center">
                <div class="col-md-4">
                    <label for="filtro-ubicacion" class="form-label">Filtrar por ubicación:</label>
                    <select class="form-select" id="filtro-ubicacion">
                        <option value="">Todas las ubicaciones</option>
                        <option value="san-jose">San José</option>
                        <option value="alajuela">Alajuela</option>
                        <option value="cartago">Cartago</option>
                        <option value="heredia">Heredia</option>
                        <option value="guanacaste">Guanacaste</option>
                        <option value="puntarenas">Puntarenas</option>
                        <option value="limon">Limón</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label for="filtro-categoria" class="form-label">Filtrar por categoría:</label>
                    <select class="form-select" id="filtro-categoria">
                        <option value="">Todas las categorías</option>
                        <option value="rescate">Rescate</option>
                        <option value="esterilizacion">Esterilización</option>
                        <option value="adopcion">Adopción</option>
                        <option value="veterinaria">Atención Veterinaria</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label for="filtro-orden" class="form-label">Ordenar por:</label>
                    <select class="form-select" id="filtro-orden">
                        <option value="nombre">Nombre A-Z</option>
                        <option value="recientes">Más recientes</option>
                        <option value="donaciones">Más donaciones</option>
                    </select>
                </div>
            </div>
        </div>
    </section>

    <!-- Lista de Asociaciones -->
    <section class="py-5">
        <div class="container">
            <div class="row g-4" id="lista-asociaciones">
                <!-- Las asociaciones se cargarán con JavaScript -->
            </div>
            <div class="text-center mt-5">
                <button class="btn btn-outline-primary" id="cargar-mas">Cargar más asociaciones</button>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-dark text-white py-4">
        <div class="container">
            <div class="text-center">
                <p>&copy; 2024 ConnectaPet. Proyecto de Ambiente Web Cliente-Servidor.</p>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./javascript/asociaciones.js"></script>
</body>
</html>
